# Azure Pipelines equivalent of .github/workflows/ci.yml -- same two-stage shape (unit tests,
# then bundle validation), so this repo's CI story doesn't change depending on which platform
# runs it. Requires two pipeline variables set in the Azure DevOps UI (Pipelines -> Edit ->
# Variables), not in this file: DATABRICKS_HOST (plain) and DATABRICKS_TOKEN (marked secret) --
# Azure Pipelines doesn't support declaring secret values in YAML. Unlike the GitHub Actions
# workflow, there's no explicit fork-PR guard here: Azure DevOps withholds secret variables
# from fork PR builds by default at the org/project settings level (Pipelines > Settings ->
# "Make secrets available to builds of forks"), not per-pipeline YAML.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Test
    jobs:
      - job: pytest
        displayName: Run unit tests
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - script: pip install -r requirements.txt
            displayName: Install test dependencies
          - script: pytest tests/ -v
            displayName: Run unit tests

  - stage: ValidateBundle
    displayName: Validate bundle
    dependsOn: Test
    jobs:
      - job: bundle_validate
        displayName: databricks bundle validate
        steps:
          - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: Install Databricks CLI
          - script: databricks bundle validate
            displayName: Validate bundle
            env:
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
